name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Доступ до приватного @scm/platform
        run: git config --global url."https://x-access-token:${{ secrets.PLATFORM_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - run: pnpm install --frozen-lockfile
      - name: Типи (tsc)
        run: pnpm typecheck
      - name: Токени (сирі кольори та px)
        run: pnpm lint:tokens
      - name: Збірка
        run: pnpm build
